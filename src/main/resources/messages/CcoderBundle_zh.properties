# CCoder 词表 —— 中文。键与格式见同目录的 CcoderBundle.properties（那份是英文基础）。
#
# 这份文件是 UTF-8 的（Java 9+ 的 ResourceBundle 按 UTF-8 读）。
# 注意：`Properties.load(InputStream)` 是 ISO-8859-1 —— 用例里要读原始文件的话，
# 必须自己包一层 InputStreamReader(UTF_8)，否则每个中文值都会变成乱码，
# 而 containsKey 这类检查**照样通过**（设计稿 §1.1 的坑）。

