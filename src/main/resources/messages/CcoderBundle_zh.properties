# 逐字保留原文（这一批只是搬家）。值里的 \n 是段内换行；与 message 之间的空行在代码里拼。
failure.auth.body=请检查 ~/.claude/settings.json 的 env 块是否包含有效的 ANTHROPIC_AUTH_TOKEN 与 ANTHROPIC_BASE_URL。\n若配置无误，可能是宿主环境变量污染——CCoder 已剥离 CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST 等 10 个变量（设计文档 §3.2）。
failure.setMode.body=权限模式没有切换，本会话仍按原来的模式跑。若要切到「绕过权限」而被拒：CCoder 启动时已带好可切换的资格，被拒说明它被设置或策略禁用了 —— 查 ~/.claude/settings.json 的 permissions.disableBypassPermissionsMode，以及是否有托管配置。
failure.setEffort.body=思考深度没有改变，这一轮仍按原来的档位跑。会话中途改档位需要较新版本的 claude 可执行文件；可以升级它，或在设置里改好后重开会话。
failure.stopTask.body=这个任务没有停下来，多半还在跑。可以再点一次终止；实在停不掉，就用输入框旁那颗「停止」把整个回合停下。若是提示不支持：终止任务需要较新版本的 claude 可执行文件。
failure.claudeNotFound.body=设置 → 环境 → 运行依赖 里可以检测 claude 并一键安装，装完点「重新检测」。也可以在那里手填 claude 可执行文件的完整路径。

