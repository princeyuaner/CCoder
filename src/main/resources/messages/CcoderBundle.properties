# ---- 错误码 → 可操作的提示（FailureHint）----
# 这五段是仓库里最密的散文，每段 2-3 句。三条硬要求：
#  1. **可操作的记号逐字保留**：ANTHROPIC_AUTH_TOKEN / ANTHROPIC_BASE_URL /
#     CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST / permissions.disableBypassPermissionsMode /
#     ~/.claude/settings.json —— 用户要拿它们去搜、去改；
#  2. **指页面要用页签的真名**：`Settings → Environment → Runtime dependencies`
#     必须与设置对话框里那两页的标题一致（FailureHintEnTest 钉住这一条）；
#  3. 与 `message`（sidecar 给的那句）拼接时，**中间那个空行留在代码里**，
#     值里不带首尾空白 —— 否则译者看不见的空行会被顺手删掉。
failure.auth.body=Check that the env block in ~/.claude/settings.json has a valid ANTHROPIC_AUTH_TOKEN and ANTHROPIC_BASE_URL.\nIf those look right, the host environment may be interfering — CCoder already strips 10 variables including CLAUDE_CODE_PROVIDER_MANAGED_BY_HOST (design doc §3.2).
failure.setMode.body=The permission mode was not switched — this session keeps running in its current mode.\nIf the switch to "Bypass permissions" was rejected: CCoder launches with the capability to switch, so a rejection means it is disabled by settings or policy — check ~/.claude/settings.json for permissions.disableBypassPermissionsMode, and whether a managed configuration applies.
failure.setEffort.body=Thinking effort was not changed — this turn keeps the current level.\nChanging the level mid-session needs a newer claude executable; upgrade it, or change it in Settings and start a new session.
failure.stopTask.body=That task did not stop, and it is most likely still running. You can press stop again; if it will not stop, use the Stop button next to the input box to end the whole turn.\nIf it says this is unsupported: stopping a task needs a newer claude executable.
failure.claudeNotFound.body=Settings → Environment → Runtime dependencies can detect claude and install it for you — reload afterwards. You can also type the full path to the claude executable there.

