# CCoder 词表 —— **基础 = 英文**。
#
# 这份是回退：平台找不到对应语言时就用它，所以英文放这儿、中文在同目录的
# CcoderBundle_zh.properties。不要建 _en：那会变成两个地方要改。
#
# 键名格式 <area>.<component>.<item>，叶子小驼峰。**永不动态拼键** ——
# TextKeysTest 靠字面量扫描钉「引用的键都在、词表里的键都有人引用」，拼出来的键它看不见。
#
# 值里 {0}、{1} 是占位符，朴素替换（不是 MessageFormat，撇号原样穿过）。
# 值**不带首尾空白**：要拼 "\n\n" 这类东西留在代码里，别放进词表 ——
# 译者看不见的空行会被顺手删掉。
#
# 语言名（中文 / English）是**自称**，不进词表，见 UiLanguage 的注释。

settings.language.label=Interface language
settings.language.followIde=Follow IDE
settings.language.hint=Saved immediately. The interface switches right away.

# 连接卡那一格。八档的语义（谁要紧、谁只是过渡）在 ConnectionState 里，这里只有字。
#
# **这一格的宽度是量出来的，英文必须短**：404px 一行里每张卡只有约 79px 可用，
# 实测 13 个字符的 "Not connected" 要 91px —— JLabel 会静默打省略号。
# 「八档连接状态都放得下」那条用例就是量这个的（-PtestLang=en 跑一遍）。
# 于是英文用短词，且**四档危险/失败状态彼此必须分得开**：
# Idle=还没有会话，Disconnected=连过又断了，RestoreFailed=没接上之前那条会话，
# StartFailed=这次压根没起来。
status.connection.idle=No session
